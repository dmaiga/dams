name: 'dams_bi'
version: '1.0.0'
config-version: 2

profile: 'dams_bi'
require-dbt-version: ">=1.12.0,<1.13.0"

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  incentive_terrain_fcfa_par_kg: 25

models:
  dams_bi:
    staging:
      +materialized: view
    marts:
      +materialized: table
      # aggregates matérialisées en table (23/07/2026) : lues à chaque chargement des dashboards
      # bi/, recalculer la requête complète (jointures + cross join mois x agents/superviseurs)
      # à chaque requête Django était le principal goulot d'étranglement de performance —
      # une table se contente d'être relue, recalculée uniquement au prochain `dbt run`.
