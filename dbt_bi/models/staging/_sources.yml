version: 2

sources:
  - name: dams_prod
    description: >
      Base de production DAMS (Django), schéma public, tables préfixées core_
      (confirmé par architecte/REFERENCE_TECHNIQUE_BI.md). Restaurée localement
      en dev depuis input/dams_2026-07-12.dump.
    schema: public
    tables:
      - name: core_vente
      - name: core_detaildistribution
      - name: core_distributionagent
      - name: core_lotentrepot
      - name: core_agent
      - name: auth_user
      - name: core_salaire
      - name: core_depense
      - name: core_produit
      - name: core_fournisseur
      - name: core_perte
      - name: core_paiementfournisseur

  - name: dams_bi_app
    description: >
      Tables applicatives de l'app Django `bi` (écriture humaine via l'admin, pas générées
      par dbt) — schéma `public`, comme les tables `core_*`. dbt-2 (2026-07-20) :
      AjustementPrixAchat est la seule donnée saisie côté BI, calibration des prix d'achat
      fournisseur pour vw_marge_fournisseur. Volontairement PAS dans le schéma `bi_`
      (réservé aux objets générés par dbt, `clean-targets`/`--full-refresh` ne doivent
      jamais pouvoir toucher une table saisie à la main).
    schema: public
    tables:
      - name: bi_ajustementprixachat
