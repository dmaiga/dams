version: 2

models:
  - name: stg_ventes
    description: "1 ligne = 1 vente comptant/crédit (est_supprime=false uniquement)."
    columns:
      - name: vente_id
        tests: [not_null, unique]
      - name: agent_id
        tests: [not_null]
      - name: quantite
        tests: [not_null]
      - name: prix_vente_unitaire
        tests: [not_null]

  - name: stg_detail_distribution
    columns:
      - name: detail_distribution_id
        tests: [not_null, unique]
      - name: lot_id
        tests: [not_null]

  - name: stg_distribution_agent
    columns:
      - name: distribution_id
        tests: [not_null, unique]

  - name: stg_lots
    columns:
      - name: lot_id
        tests: [not_null, unique]
      - name: prix_achat_unitaire
        tests: [not_null]

  - name: stg_agents
    columns:
      - name: agent_id
        tests: [not_null, unique]
      - name: type_agent
        tests:
          - accepted_values:
              arguments:
                values: ['direction', 'rot', 'entrepot', 'terrain', 'agent_gros', 'agent_polivalent', 'stagiaire', 'gestionnaire_stock']

  - name: stg_utilisateurs
    columns:
      - name: user_id
        tests: [not_null, unique]

  - name: stg_salaires
    columns:
      - name: salaire_id
        tests: [not_null, unique]
      - name: agent_id
        tests: [not_null]

  - name: stg_depenses
    columns:
      - name: depense_id
        tests: [not_null, unique]
      - name: montant
        tests: [not_null]

  - name: stg_produits
    columns:
      - name: produit_id
        tests: [not_null, unique]

  - name: stg_regle_salaire
    description: >
      core_reglesalaire, filtrée actif=true. 1 ligne par type_agent au plus (unique côté
      Django) — source des taux paie configurables par l'admin, utilisée par fct_salaires
      pour recalculer salaire_base/incentive sans dépendre de core_salaire.
    columns:
      - name: type_agent
        tests: [not_null, unique]

  - name: stg_fournisseurs
    columns:
      - name: fournisseur_id
        tests: [not_null, unique]

  - name: stg_pertes
    columns:
      - name: perte_id
        tests: [not_null, unique]

  - name: stg_paiements_fournisseur
    columns:
      - name: paiement_id
        tests: [not_null, unique]

  - name: stg_ajustements_prix_achat
    description: >
      dbt-2 (2026-07-20) ; refonte dbt-7 (23/07/2026) : fournisseur_id/produit_id/annee/mois
      dérivés par jointure sur stg_lots (via lot_id), plus saisis à la main côté Django.
    columns:
      - name: ajustement_id
        tests: [not_null, unique]
      - name: fournisseur_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fournisseur')
                field: fournisseur_id
      - name: quantite_concernee
        tests: [not_null]
      - name: prix_achat_corrige
        tests: [not_null]
