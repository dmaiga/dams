version: 2

models:
  - name: vw_rentabilite_globale
    description: >
      Dashboard 1 (Santé Globale). 1 ligne par mois : CA, coût d'achat, marge brute,
      coût salaires, coût dépenses, rentabilité nette (KPI-001 à KPI-009).
    columns:
      - name: mois
        tests: [not_null, unique]
      - name: rentabilite_nette
        tests: [not_null]

  - name: vw_rentabilite_journaliere
    description: >
      Dashboard 1 (Santé Globale), graphique de tendance uniquement (23/07/2026). 1 ligne par
      jour : CA, coût d'achat, marge brute, coût dépenses — pas de salaires (non pertinent à ce
      grain, cf. commentaire du modèle).
    columns:
      - name: jour
        tests: [not_null, unique]

  - name: vw_rentabilite_produit
    description: >
      Dashboard 2 (Rentabilité Produit). 1 ligne par produit x mois (KPI-101 à KPI-106) —
      un produit sans vente sur un mois donné n'a pas de ligne pour ce mois.
    columns:
      - name: produit_mois_id
        tests: [not_null, unique]
      - name: produit_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_produit')
                field: produit_id

  - name: vw_performance_superviseur
    description: >
      Dashboard "Performance Agent & Équipes", volet équipes (KPI-201 à KPI-206). 1 ligne par
      superviseur (= dim_agent filtrée type_agent='entrepot') x mois — un superviseur sans
      vente sur un mois apparaît quand même (valeurs à 0), cf. commentaire du modèle.
    columns:
      - name: superviseur_mois_id
        tests: [not_null, unique]
      - name: superviseur_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_agent')
                field: agent_id

  - name: vw_performance_agent
    description: >
      Dashboard "Performance Agent & Équipes" (KPI-301 à KPI-306). 1 ligne par agent
      terrain/agent_gros/agent_polivalent x mois — un agent actif sans vente sur un mois
      apparaît quand même (kg_par_jour=0, statut 'sous_objectif'), cf. commentaire du modèle.
    columns:
      - name: agent_mois_id
        tests: [not_null, unique]
      - name: agent_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_agent')
                field: agent_id
      - name: statut_objectif_50kg
        tests:
          - accepted_values:
              arguments:
                values: ['atteint', 'proche', 'sous_objectif']
              config:
                severity: warn

  - name: vw_analyse_stock
    description: "Dashboard 5 (Stock & Fournisseur). 1 ligne par couple produit x fournisseur (KPI-401, KPI-402)."
    columns:
      - name: valeur_stock
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: vw_marge_fournisseur
    description: >
      Dashboard 5, volet fournisseur (dbt-2, 2026-07-20 ; produit ajouté le 23/07/2026).
      1 ligne par fournisseur x produit x mois (KPI-403 à KPI-405). marge_calibree applique la
      correction bi.AjustementPrixAchat (grain fournisseur x mois, diffusée à tous les produits
      du fournisseur pour ce mois) quand elle existe, sinon = marge_systeme.
    columns:
      - name: fournisseur_mois_id
        tests: [not_null, unique]
      - name: fournisseur_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fournisseur')
                field: fournisseur_id
      - name: produit_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_produit')
                field: produit_id
      - name: ca
        tests: [not_null]

  - name: vw_depenses_categorie
    description: >
      Dashboard 3, partie 2 (20/07/2026). 1 ligne par catégorie x mois (KPI-701/702).
      montant_pct = part de la catégorie dans le total des dépenses du mois (categorie peut
      être NULL - 21 lignes core_depense sans catégorie en base, écart DAMS documenté dans
      architecte/REFERENCE_TECHNIQUE_BI.md #6.3.22, non masqué ici).
    columns:
      - name: depense_categorie_id
        tests: [not_null, unique]
      - name: montant
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
