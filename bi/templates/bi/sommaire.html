{% extends "bi/base_dashboard.html" %}

{% block dashboard_content %}
<div class="bi-panel">
    <h2>Dashboards BI</h2>
    <div class="row g-3">
        {% for onglet in dashboards %}
        <div class="col-md-6 col-lg-4">
            <a href="{{ onglet.url }}" class="text-decoration-none">
                <div class="bi-panel h-100 mb-0">
                    <h2 class="mb-0">{{ onglet.titre }}</h2>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
