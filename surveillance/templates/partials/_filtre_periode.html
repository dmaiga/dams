<div class="flex flex-wrap items-center gap-2">
    <div class="join">
        <a href="?periode=semaine{% if request.GET.superviseur %}&superviseur={{ request.GET.superviseur }}{% endif %}{% if request.GET.produit %}&produit={{ request.GET.produit }}{% endif %}"
           class="btn btn-sm join-item {% if periode == 'mois' %}btn-ghost{% else %}btn-primary{% endif %}">Semaine</a>
        <a href="?periode=mois{% if request.GET.superviseur %}&superviseur={{ request.GET.superviseur }}{% endif %}{% if request.GET.produit %}&produit={{ request.GET.produit }}{% endif %}"
           class="btn btn-sm join-item {% if periode == 'mois' %}btn-primary{% else %}btn-ghost{% endif %}">Mois</a>
    </div>

    <form method="get" class="flex items-center gap-2">
        <input type="hidden" name="periode" value="{{ periode }}">
        {% if request.GET.superviseur %}<input type="hidden" name="superviseur" value="{{ request.GET.superviseur }}">{% endif %}
        {% if request.GET.produit %}<input type="hidden" name="produit" value="{{ request.GET.produit }}">{% endif %}

        {% if periode == 'mois' %}
        <label class="label-text text-sm font-semibold text-base-content/75">Mois :</label>
        <input
            type="month"
            name="mois"
            value="{{ mois_selectionne }}"
            max="{{ mois_max }}"
            class="input input-bordered input-sm font-mono text-xs w-36"
        >
        {% else %}
        <label class="label-text text-sm font-semibold text-base-content/75">Semaine :</label>
        <input
            type="week"
            name="semaine"
            value="{{ semaine_selectionnee }}"
            max="{{ semaine_max }}"
            class="input input-bordered input-sm font-mono text-xs w-44"
        >
        {% endif %}
        <button type="submit" class="btn btn-primary btn-sm font-semibold">Appliquer</button>
    </form>
</div>
